<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archava CRM</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Archava CRM</strong>
        <p>Contacts, activities and follow-up</p>
      </header>
      <p id="status" role="status" aria-live="polite">Loading your session…</p>
      <form id="login" hidden>
        <h1>Sign in</h1>
        <label
          >Email<input
            name="username"
            type="email"
            autocomplete="username"
            required
            maxlength="254"
        /></label>
        <label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="128"
        /></label>
        <button type="submit">Sign in</button>
        <p>Ask your administrator for an account.</p>
      </form>
      <section id="workspace" hidden>
        <nav aria-label="Workspace">
          <span id="account"></span><label>Business<select id="tenants"></select></label
          ><button id="logout" type="button">Sign out</button>
        </nav>
        <section id="overview" aria-label="Kondisi CRM"></section>
        <section id="worklist" aria-label="Daftar kerja follow-up"></section>
        <section id="crm" aria-label="CRM"></section>
        <section id="pipeline" aria-label="Sales pipeline"></section>
        <section id="conversation" aria-label="Archava CRM conversation"></section>
        <details>
          <summary>Change password</summary>
          <form id="password">
            <label
              >Account<input name="username" type="email" autocomplete="username" readonly
            /></label>
            <label
              >Current password<input
                name="current"
                type="password"
                autocomplete="current-password"
                required
                maxlength="128" /></label
            ><label
              >New password (15–128 characters)<input
                name="next"
                type="password"
                autocomplete="new-password"
                required
                minlength="15"
                maxlength="128" /></label
            ><button type="submit">Change password and sign out</button>
          </form>
        </details>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
