name: Security audit

# Advisories move without a commit. A dependency that was clean the day it was
# installed becomes a finding while nothing in this tree changes — that is the
# whole reason this workflow exists on a clock instead of on a push.
#
# Both jobs fail the run on a finding and report only: they never bump a version
# or open a PR on their own.

on:
  schedule:
    # 03:17 UTC / 10:17 WIB, daily.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  rust:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # .cargo/audit.toml ignores RUSTSEC-2026-0459 because libsqlite3-sys is in
      # Cargo.lock without being built. That holds only while this prints nothing.
      - name: The ignored SQLite advisory still concerns a crate nothing builds
        run: |
          graph="$(cargo tree --locked --workspace --target all -e all -i libsqlite3-sys 2>/dev/null || true)"
          if [ -n "$graph" ]; then
            echo "libsqlite3-sys is now in the build graph; remove the ignore in .cargo/audit.toml:"
            echo "$graph"
            exit 1
          fi

      - name: Audit the Rust workspace (fail on any RUSTSEC vulnerability)
        run: cargo audit

      - name: Audit the benchmark crate (fail on any RUSTSEC vulnerability)
        working-directory: tools/rust/benchmark/rust
        run: cargo audit
