name: CI

# The gates a PR must clear before review, in the order they fail fastest.
#
# The rust-workspace job verifies the pure Rust platform workspace (22 crates).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust Platform Workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3

      - name: Install build toolchain dependencies & PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql clang mold sccache || sudo apt-get install -y postgresql clang mold
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
          if ! command -v sccache &> /dev/null; then
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Repository boundaries and helper regressions
        run: |
          node tools/check-structure.mjs
          node tools/check-modules.mjs
          node tools/check-docs.mjs
          node --test tools/test/*.test.mjs

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Full Workspace Test Suite
        run: cargo test --workspace --locked -- --test-threads=1

      - name: WASM Portable Boundary Gate
        run: |
          cargo check --target wasm32-unknown-unknown -p archava-core -p archava-domain
          cargo check --target wasm32-unknown-unknown -p archava-slice --lib --features hydrate

      - name: Install matching WASM packager
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build release server and browser payload
        run: node tools/rust/build-slice.mjs

      # The Ubuntu 24.04 runner includes Chrome. The gate discovers the installed
      # browser, uses an isolated profile/fixture, and closes its own processes.
      - name: Browser operator acceptance and production restart
        run: node tools/e2e/verify.mjs --output target/e2e/ci

      - name: Browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance
          path: target/e2e/ci/
          if-no-files-found: ignore
          retention-days: 7
