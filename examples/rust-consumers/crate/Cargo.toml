[package]
name = "consumer-crate"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.96"

# Consumer A: consume the R02 engines as *crate tarballs*, the way a Rust
# customer would.
#
# The two dependencies below are the packaged crates, consumed from `deps/`.
# That directory is materialized by `tools/library/verify-rust-consumers.mjs`
# from the `.crate` files `cargo package` emits into `rust/target/package/` —
# unpacked, so each one is a self-contained manifest with the workspace fields
# already resolved. It is deliberately *inside this directory* rather than
# anywhere else in the scratch tree, for two reasons: the relative path stays
# short and says what it is, and it keeps the whole consumer in one place a
# reviewer can look at.
#
# `deps/` is not `vendor/`, and the distinction is not cosmetic. The vendored
# third-party closure does live in `vendor/` (see ADR-R08, decision 2); the
# product's own crates cannot go there, because `cargo vendor` writes a
# `.cargo-checksum.json` beside everything in its output and *requires* one —
# which an unpacked `.crate` tarball does not have. Two directories, one rule.
#
# There is no `path =` into `rust/crates/`, and no absolute path of any kind.
# G05 names exactly that as a FAIL: "Import source workspace/absolute machine
# paths". A path dependency into the product tree would prove only that the
# product tree still compiles — which the product's own `cargo test` already
# proves. This consumer is the one that gets to claim otherwise, and it can only
# do so if its own manifest never points at the product.
#
# `--offline` in the verifier is what makes the difference between "cold" and
# "convenient". Every third-party crate is vendored by the same run, so this
# consumer has no route to crates.io and no dependence on the machine's own
# `~/.cargo` cache — a dependency found in a local cache is not a dependency a
# clean machine would have.
#
# `serde` and `serde_json` are declared dependencies rather than unwrapped
# freebies for the same reason: the versions are pinned here, by this manifest,
# so the consumer's own lockfile decides them. `serde_json` carries `derive`-era
# features on the serde side and `preserve_order` here, which is what makes the
# 26-key quote keep its key order end to end.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dependencies.archava-pricing]
path = "deps/archava-pricing-0.1.0"

[dependencies.archava-rates]
path = "deps/archava-rates-0.1.0"

[dependencies.archava-assembly]
path = "deps/archava-assembly-0.1.0"

[dev-dependencies]
# Nothing. This consumer brings its own assertions and reads no fixture from the
# workspace's test tree, which is the point: a dev-dependency on the product's
# own test helpers would make the two runs share a vocabulary.

# Standalone. Without this, a `cargo` invocation that reaches this directory
# through a parent workspace pulls the whole product workspace in, and the
# "cold" consumer starts resolving the product's lockfile.
[workspace]
