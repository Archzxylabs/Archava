[package]
name = "archava-domain"
description = "Business-module domain rules for the Archava Rust host"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
archava-core.workspace = true

# No HTTP framework, and no database driver: a domain rule that can open a socket
# is a domain rule that can be reached without the host's authority checks. This
# crate must stay `wasm32`-clean because the authority rules are evaluated in the
# browser (client-side policy preview), and `archava-adapters` pulls in sqlx →
# mio, which cannot target wasm at all.
#
# `archava-adapters` is deliberately NOT a dependency here. The `lib.rs` header
# states that domain *operations* take a checked `TenantTransaction` — but no
# such operation exists yet. At R01 the only module is `authority.rs`, pure
# policy with no I/O. When R02 ports the first transaction-taking domain
# function, it must NOT be added to this crate: doing so would reintroduce sqlx
# and break the wasm build this gate proves. The transaction-taking operations
# belong in a separate host-side crate (e.g. `archava-domain-pg`) that composes
# the pure rules here with the RLS cohort, so the browser-reachable half stays
# socket-free. That split is recorded here as the R02 boundary rather than
# pre-loading a socket dependency the browser build cannot carry.
thiserror.workspace = true
serde.workspace = true
# ERP fingerprint canonicalization needs a JSON value traversal (archxy2 ERP
# namespace; integration packet PACKET-000 records this shared-file diff).
serde_json.workspace = true
# R07's billing cohort (PACKET-007): the provider-event digest is pure
# crypto arithmetic — `HMAC-SHA256(domain ‖ framed parts)` under a
# deployment key — and a digest computed anywhere else is not the
# settlement's authority. hmac/sha2 are already workspace crates (the
# provider crate hashes migration files; the host digests sessions); the
# wasm boundary holds because both are pure-Rust, socket-free.
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio.workspace = true
