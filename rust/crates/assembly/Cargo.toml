[package]
name = "archava-assembly"
description = "Deployment/assembly planning ported from packages/config/src/assembly.ts (R02 p3 slice)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# R02's second deliverable: deployment/assembly planning.
#
# PRD_FULL_RUST.md:656 names R02 as "Pricing, deployment/assembly planning dan
# capacity math", so this crate and `archava-capacity-math` are the two halves
# that were missing when R02 was declared complete with only pricing and rates
# on the ledger. docs/rust/EXECUTION_STATE.md:18's "R02 complete" and its own
# R02 table (seven rows, none of them assembly planning) are both contradicted
# by that line of the PRD; the table is corrected as part of closing this.
#
# This crate originates in the product tree, not the pilot — `planAssembly` has
# only ever existed as `packages/config/src/assembly.ts:618`. The pilot's
# `planning` and `schedule` crates are `placeholder()` stubs (D04), so there is
# nothing to promote and ADR-R06 does not apply.
#
# Only `serde`. That is what keeps it wasm-clean like pricing and rates: this
# planner is pure arithmetic and set logic over deserialized data, so the same
# code that renders a deployment preview in a browser is the code that renders
# one on the host. Adding anything else here would break the R01 wasm gate for a
# slice with no HTTP and no database surface to justify it.
[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
