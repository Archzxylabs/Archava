[package]
name = "archava-providers"
description = "Provider attempt ledger and fail-closed provider runtime (ports/adapters for Gemini-scale integration seams)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The `uuid` feature gives typed `Uuid` binds (the attempts table's primary key
# half is a `uuid` column); string data round-tripping through a typed column
# is exactly the escape hatch the schema is meant to close — same rule the
# adapters crate records for `archava_host` ids. No chrono: every timestamp
# comparison and derivation (lease expiry, usage-day rollover, cooldown
# remainder, retry margins, elapsed milliseconds) runs INSIDE PostgreSQL with
# `clock_timestamp()`, because a wall clock different from the server's is how
# a budget ledger admits twice or blocks forever.
sqlx.workspace = true
# The migration-ledger checksum uses the same digest the adapters' readiness
# checker uses (the baseline hashes migration files with sha256; the recorded
# pair must match byte-for-byte). `sha2` is already inside Cargo.lock (sqlx
# depends on it), so this adds no registry resolution.
sha2.workspace = true
# Error surfaces with the fixed messages the boundary carries. No panic
# paths in a budget ledger.
thiserror.workspace = true
# The wire seams (gemini.rs, postmark.rs) read provider replies and build
# request bodies: the JSON trees of `packages/crm-assistant/src/
# gemini-planner.ts` and `packages/act-postmark/src/gateway.ts`. `serde_json`
# is already in the tree (the adapters crate pulls it): no resolution.
serde_json.workspace = true

# Native network boundary; the domain remains socket-free.
archava-domain.workspace = true
reqwest.workspace = true
serde.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
base64.workspace = true

# The disposable owned instance. Dev-only by the same rule the fixture's own
# crate records: no production crate depends on it, and the crate graph holds.
archava-pg-fixture = { path = "../pg-fixture" }
# `time` for the lease-expiry sleeps; `macros`/`rt-multi-thread` for the
# `#[tokio::test]` runners the host suites share.
tokio = { workspace = true, features = ["time", "io-util"] }
