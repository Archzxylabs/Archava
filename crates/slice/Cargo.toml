[package]
name = "archava-slice"
description = "Leptos SSR/WASM vertical slice — §1.4B's one real product flow"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# One crate, two compilation targets — the standard Leptos arrangement, chosen
# so the *same* view code is what the server renders and what the browser
# hydrates. A shared crate plus two wrappers would put the views and their
# hydration contract in different crates, where they can drift apart silently;
# here the compiler guarantees the markup the server emits is the markup the
# client expects, because it is one program.
#
# The server target takes the host and the axum integration. The wasm target
# takes neither: `archava-host` cannot compile for wasm32 (the wasm boundary
# gate proves exactly that) and does not need to — every business fact the UI
# shows arrives through the host's HTTP routes, which is also what makes the
# browser proof one of the REAL surface rather than a test-only side door.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
archava-adapters.workspace = true
archava-host.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["hydrate"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
# Direct DOM surface: the fetch plumbing (headers/request/response), the
# idempotency key's `crypto.randomUUID`, `localStorage` for the CSRF echo.
web-sys = { version = "0.3", features = [
    "console",
    "Crypto",
    "Headers",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Window",
] }
js-sys = "0.3"

[dependencies]
leptos_router.workspace = true
serde_json.workspace = true

[features]
# The hydration build compiles the cdylib export for wasm32 with this feature
# on ("--features hydrate"); nothing else in the crate switches on it — the
# target triple itself decides the leptos/ssr-vs-hydrate split.
hydrate = []

# The browser entry lives in this crate's cdylib export (`hydrate`), compiled
# only for wasm32; the server build never needs it, because the SSR shell
# references the bundle the wasm-bindgen CLI produces at serving time.
[lib]
# The browser entry is this crate's cdylib export (`hydrate`); the SSR build
# links the same crate as an rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "archava-server"
path = "src/bin/archava_server.rs"

[dev-dependencies]
archava-providers.workspace = true
# The fixture server (`examples/slice_server.rs`) provisions the same disposable
# PostgreSQL the integration suites use, so the browser proof drives the real
# non-owner RLS path rather than a seeded mock. Dev-only, like every other
# crate's use of it: nothing in the shipped UI knows a fixture exists.
archava-pg-fixture = { path = "../pg-fixture" }
tower = { version = "0.5", features = ["util"] }
sqlx.workspace = true
# The restart's serde-checked handshake (`ARCHAVA_SLICE_ATTACH` printed by one
# `run`, parsed by the next).
serde.workspace = true
