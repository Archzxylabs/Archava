# Configuration for cargo-deny (cargo-deny check)
# Enforces supply chain security, license compliance, and dependency hygiene across Archava's 22 crates.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
ignore = [
    # paste is unmaintained upstream; used transitively by Leptos 0.8 / reactive_graph / tachys.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
